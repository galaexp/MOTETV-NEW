syntax = "proto2";

package polo.wire.protobuf;

option java_package = "polo.wire.protobuf";
option java_outer_classname = "PoloProto";

enum RoleType {
    ROLE_TYPE_UNKNOWN = 0;
    ROLE_TYPE_INPUT = 1;
    ROLE_TYPE_OUTPUT = 2;
    ROLE_TYPE_CONTROLLER = 3;
}

enum Status {
    STATUS_UNKNOWN = 0;
    STATUS_OK = 200;
    STATUS_ERROR = 400;
    STATUS_BAD_CONFIGURATION = 401;
    STATUS_BAD_SECRET = 402;
}

enum EncodingType {
    ENCODING_TYPE_UNKNOWN = 0;
    ENCODING_TYPE_ALPHANUMERIC = 1;
    ENCODING_TYPE_NUMERIC = 2;
    ENCODING_TYPE_HEXADECIMAL = 3;
    ENCODING_TYPE_QRCODE = 4;
}

enum MessageType {
    MESSAGE_TYPE_UNKNOWN = 0;
    MESSAGE_TYPE_PAIRING_REQUEST = 10;
    MESSAGE_TYPE_PAIRING_REQUEST_ACK = 11;
    MESSAGE_TYPE_OPTIONS = 20;
    MESSAGE_TYPE_CONFIGURATION = 30;
    MESSAGE_TYPE_CONFIGURATION_ACK = 31;
    MESSAGE_TYPE_SECRET = 40;
    MESSAGE_TYPE_SECRET_ACK = 41;
}

message Encoding {
    optional EncodingType type = 1;
    optional uint32 symbol_length = 2;
}

message PairingRequest {
    optional string service_name = 1;
    optional string client_name = 2;
}

message PairingRequestAck {
    optional string server_name = 1;
}

message Options {
    repeated Encoding input_encodings = 2;
    repeated Encoding output_encodings = 3;
    optional RoleType preferred_role = 4;
}

message Configuration {
    optional Encoding encoding = 1;
    optional RoleType client_role = 2;
}

message ConfigurationAck {
}

message Secret {
    optional bytes secret = 1;
}

message SecretAck {
    optional bytes secret = 1;
}

message OuterMessage {
    optional uint32 protocol_version = 1;
    optional Status status = 2;
    optional MessageType type = 3;

    optional PairingRequest pairing_request = 10;
    optional PairingRequestAck pairing_request_ack = 11;
    optional Options options = 20;
    optional Configuration configuration = 30;
    optional ConfigurationAck configuration_ack = 31;
    optional Secret secret = 40;
    optional SecretAck secret_ack = 41;
}
